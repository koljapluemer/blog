<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>blog</title>
<style>
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1.05rem/1.6 system-ui, sans-serif; }
  h1, h2, h3 { line-height: 1.25; }
  a { color: inherit; }
  .missing { color: #b42318; cursor: not-allowed; text-decoration: none; }
  img, video { max-width: 100%; height: auto; }
  pre { overflow-x: auto; padding: .75rem 1rem; border-radius: 6px; background: rgba(127, 127, 127, .12); }
  code { font-size: .9em; }
  pre code { font-size: inherit; }
  blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid rgba(127, 127, 127, .4); }
  table { border-collapse: collapse; }
  th, td { padding: .3rem .6rem; border-bottom: 1px solid rgba(127, 127, 127, .3); }
  .viz { margin: 1.5rem 0; }
  .viz iframe { display: block; width: 100%; border: 0; }
  .viz summary { cursor: pointer; font-size: .85rem; opacity: .6; }
  .viz details pre { margin: .4rem 0 0; white-space: pre-wrap; font: .85rem/1.5 system-ui, sans-serif; }
</style>
</head>
<body>

<main>
<p>Welcome to <a href="https://koljasam.com/">Kolja Sam</a>'s blog</p>

</main>
</body>
</html>
