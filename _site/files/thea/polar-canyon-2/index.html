<body>
<div id="app" class="dp">
  <figure class="dp-plot">
    <svg id="plot" viewBox="0 0 400 400" role="img" aria-label="Two vectors a and b from the origin, with the projection of b onto a"></svg>
    <figcaption>Drag the tips of <b class="ca">a</b> and <b class="cb">b</b>, or type their coordinates.</figcaption>
  </figure>

  <div class="dp-side">
    <div class="dp-inputs">
      <label class="vec">
        <span class="name ca">a</span><span class="eq">= (</span>
        <input id="ax" type="number" step="0.5" min="-5" max="5" aria-label="a, x component">
        <span class="sep">,</span>
        <input id="ay" type="number" step="0.5" min="-5" max="5" aria-label="a, y component">
        <span class="eq">)</span>
      </label>
      <label class="vec">
        <span class="name cb">b</span><span class="eq">= (</span>
        <input id="bx" type="number" step="0.5" min="-5" max="5" aria-label="b, x component">
        <span class="sep">,</span>
        <input id="by" type="number" step="0.5" min="-5" max="5" aria-label="b, y component">
        <span class="eq">)</span>
      </label>
    </div>

    <div class="dp-result">
      <span class="lbl"><b class="ca">a</b> · <b class="cb">b</b> =</span>
      <span id="result" class="val"></span>
    </div>

    <div class="dp-way">
      <div class="way-title">Multiply matching components, then add</div>
      <div id="alg" class="formula"></div>
    </div>

    <div class="dp-way">
      <div class="way-title">Length of <b class="ca">a</b> × shadow of <b class="cb">b</b> on <b class="ca">a</b></div>
      <div id="geo" class="formula"></div>
    </div>

    <div class="dp-gauge">
      <div class="gauge-track"><div id="gauge-fill" class="gauge-fill"></div><div class="gauge-mid"></div></div>
      <div class="gauge-labels"><span>opposite</span><span>perpendicular</span><span>same way</span></div>
      <p id="note" class="note"></p>
    </div>
  </div>
</div>
