<body>
<div id="app" class="wp">
  <div class="wp-controls">
    <div class="wp-buttons">
      <button type="button" id="play" class="wp-btn wp-primary" aria-label="Pause">Pause</button>
      <button type="button" id="reset" class="wp-btn">Reset</button>
    </div>
    <label class="wp-slider">
      <span class="wp-lab">Momentum <i>k</i>₀ <output id="k0-out"></output></span>
      <input id="k0" type="range" min="-80" max="80" step="1" value="40">
    </label>
    <label class="wp-slider">
      <span class="wp-lab">Width σ <output id="sigma-out"></output></span>
      <input id="sigma" type="range" min="0.02" max="0.12" step="0.005" value="0.05">
    </label>
    <label class="wp-slider">
      <span class="wp-lab">Speed <output id="speed-out"></output></span>
      <input id="speed" type="range" min="0" max="6" step="1" value="2">
    </label>
  </div>

  <div class="wp-plot">
    <canvas id="plot" aria-label="Wave function in a box"></canvas>
    <div class="wp-legend">
      <button type="button" class="wp-chip on" data-series="env"><span class="sw sw-env"></span>|ψ|</button>
      <button type="button" class="wp-chip on" data-series="re"><span class="sw sw-re"></span>Re ψ</button>
      <button type="button" class="wp-chip on" data-series="im"><span class="sw sw-im"></span>Im ψ</button>
      <div class="wp-grid">
        <span class="wp-lab">Grid points <i>N</i></span>
        <div class="wp-seg" id="grid" role="group" aria-label="Grid points">
          <button type="button" data-n="32">32</button>
          <button type="button" data-n="64">64</button>
          <button type="button" data-n="128">128</button>
          <button type="button" data-n="256">256</button>
          <button type="button" data-n="512" class="on">512</button>
          <button type="button" data-n="1024">1024</button>
        </div>
      </div>
    </div>
  </div>
</div>
