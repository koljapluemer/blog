<body>
<div id="app" class="cv">
  <div class="cv-controls">
    <button type="button" id="play" class="btn btn-primary" aria-label="Pause">
      <svg viewBox="0 0 16 16" aria-hidden="true" class="ic ic-pause"><rect x="3.5" y="2.5" width="3" height="11" rx="0.8"/><rect x="9.5" y="2.5" width="3" height="11" rx="0.8"/></svg>
      <svg viewBox="0 0 16 16" aria-hidden="true" class="ic ic-play"><path d="M4.5 2.6v10.8a.6.6 0 0 0 .9.5l8.6-5.4a.6.6 0 0 0 0-1L5.4 2.1a.6.6 0 0 0-.9.5z"/></svg>
      <span class="lbl">Pause</span>
    </button>
    <button type="button" id="restart" class="btn" title="Clear the result and start again at the top-left pixel">Restart</button>
    <button type="button" id="newimg" class="btn" title="Draw new random rectangles and restart">New image</button>
    <span class="sep" aria-hidden="true"></span>
    <label class="sel">Speed
      <select id="speed">
        <option value="3000" selected>3 s / pixel</option>
        <option value="1000">1 s / pixel</option>
        <option value="250">0.25 s / pixel</option>
        <option value="30">fast</option>
      </select>
    </label>
  </div>

  <div class="cv-main">
    <figure class="panel">
      <figcaption><b>Input</b> <span class="mono">I(x, y)</span> <span class="hint">white = 1, black = 0</span></figcaption>
      <svg id="input" class="grid-svg" viewBox="-1 -1 22 22" role="img" aria-label="20 by 20 black and white input image"></svg>
    </figure>

    <div class="panel calc">
      <div class="formula mono">O(x, y) = <span class="sigma">Σ</span><sub>i,j</sub> I(x+i, y+j) · <span class="red">K(i, j)</span></div>
      <div class="mats">
        <div class="mat-wrap"><div class="mat-cap">patch of I</div><div id="m-patch" class="mat"></div></div>
        <div class="op">×</div>
        <div class="mat-wrap"><div class="mat-cap red">kernel K</div><div id="m-kernel" class="mat mat-k"></div></div>
        <div class="op">=</div>
        <div class="mat-wrap"><div class="mat-cap">products</div><div id="m-prod" class="mat"></div></div>
      </div>
      <div class="sum mono" id="sum"></div>
      <div class="status">
        <span id="pos" class="mono"></span>
        <div class="bar"><div id="bar-fill"></div></div>
      </div>
    </div>

    <figure class="panel">
      <figcaption><b>Edges</b> <span class="mono">O(x, y) ≥ 2</span> <span class="hint"><i class="key"></i>edge pixel</span></figcaption>
      <svg id="output" class="grid-svg" viewBox="-1 -1 22 22" role="img" aria-label="Detected edges shown in red on the image"></svg>
    </figure>
  </div>
</div>
