<div class="viz">
  <div class="controls">
    <button type="button" id="play" class="btn" aria-pressed="true">
      <svg class="ico ico-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>

    </button>

    <span class="step" id="step">step 0</span>

    <div class="graph-pane">
