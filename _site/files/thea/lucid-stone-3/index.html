<div id="app" class="cv">

        <option value="0.05">Fast</option>
      </select>

    <label class="cv-field cv-sigma">σ <input type="range" id="sigma" min="0.5" max="1.5" step="0.1" value="1"><output id="sigma-val">1.0</output></label>

      <figcaption><b>f</b> input image</figcaption>
    </figure>
    <div class="cv-op">∗</div>
    <figure class="cv-panel cv-kernel">
      <canvas id="c-k"></canvas>
      <figcaption><b>g</b> row-only Gaussian</figcaption>
    </figure>
    <div class="cv-op">=</div>
    <figure class="cv-panel">
      <canvas id="c-out"></canvas>
      <figcaption><b>f ∗ g</b> blurred</figcaption>
    </figure>
  </div>

  <div class="cv-detail">
    <div class="cv-detail-head">
      <span>Pointer at <span id="pos" class="cv-mono"></span> <span class="cv-count">· pixel <span id="count" class="cv-mono"></span></span></span>
      <span class="cv-dwell" aria-hidden="true"><i id="dwell"></i></span>
    </div>
    <div class="cv-strips">
      <span class="cv-lab"><b>f</b> row window</span><canvas id="c-patch"></canvas>
      <span class="cv-lab"><b>×</b> weights g</span><canvas id="c-w"></canvas>
      <span class="cv-lab"><b>=</b> products</span><canvas id="c-prod"></canvas>
      <span class="cv-lab"><b>Σ</b> new pixel</span>
      <div class="cv-sum">
        <div class="cv-swatch" id="swatch"></div>
        <span class="cv-mono" id="sum"></span>
        <span class="cv-cap">was <span id="orig" class="cv-mono"></span> · rows above and below are ignored</span>
      </div>
    </div>
  </div>

  <div class="cv-profile">
    <div class="cv-detail-head">Row <span id="row" class="cv-mono"></span> as 1-D functions: the kernel slides along and smears sharp edges into slopes</div>
    <svg id="prof" role="img" aria-label="Row profile of input and blurred output"></svg>
    <div class="cv-legend">
      <span><i class="l-in"></i>input f</span>
      <span><i class="l-k"></i>kernel g at pointer</span>

    </div>
  </div>
</div>
